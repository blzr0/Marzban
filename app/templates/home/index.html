<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<title>Welcome</title>
<style>
    :root {
        --bg: #07090d;
        --fg: rgba(226, 232, 240, 0.78);
        --muted: rgba(226, 232, 240, 0.32);
        --dot: #4ade80;
    }

    @media (prefers-color-scheme: light) {
        :root {
            --bg: #f5f6f8;
            --fg: rgba(15, 23, 42, 0.78);
            --muted: rgba(15, 23, 42, 0.36);
            --dot: #16a34a;
        }
    }

    html,
    body {
        height: 100%;
        margin: 0;
    }

    body {
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
    }

    main {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
    }

    .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 18px 26px;
        border-radius: 14px;
        background: color-mix(in srgb, var(--bg) 55%, transparent);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        opacity: 0;
        transform: translateY(6px);
        animation: show 1.2s 0.4s ease-out forwards;
    }

    .host {
        letter-spacing: 0.08em;
        font-size: 14px;
        max-width: calc(100vw - 80px);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .status {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
    }

    .status::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--dot);
        box-shadow: 0 0 8px var(--dot);
        animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes show {
        to {
            opacity: 1;
            transform: none;
        }
    }

    @keyframes pulse {
        50% {
            opacity: 0.35;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .card,
        .status::before {
            animation: none;
            opacity: 1;
            transform: none;
        }
    }
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<main>
    <div class="card">
        <div class="host" id="host">localhost</div>
        <div class="status">operational</div>
    </div>
</main>
<script>
    (function () {
        var host = location.hostname || "localhost";
        document.getElementById("host").textContent = host;
        document.title = host;

        var canvas = document.getElementById("field");
        var ctx = canvas.getContext("2d");
        var dark = !window.matchMedia("(prefers-color-scheme: light)").matches;
        var still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var bg = dark ? "7, 9, 13" : "245, 246, 248";
        var w, h, dpr, particles, t = 0;

        function field(x, y) {
            // smooth pseudo-noise from layered sines, drifts slowly with t
            var s = 0.0016;
            return Math.sin(x * s + t * 0.21) * 1.7
                + Math.cos(y * s * 1.3 - t * 0.17) * 1.3
                + Math.sin((x + y) * s * 0.7 + t * 0.11);
        }

        function spawn(p) {
            p.x = Math.random() * w;
            p.y = Math.random() * h;
            p.age = 0;
            p.life = 120 + Math.random() * 260;
            return p;
        }

        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            w = window.innerWidth;
            h = window.innerHeight;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.fillStyle = "rgb(" + bg + ")";
            ctx.fillRect(0, 0, w, h);
            var count = Math.min(1400, Math.round(w * h / 900));
            particles = [];
            for (var i = 0; i < count; i++) particles.push(spawn({}));
        }

        function step() {
            t += 0.01;
            ctx.fillStyle = "rgba(" + bg + ", 0.06)";
            ctx.fillRect(0, 0, w, h);
            ctx.lineWidth = 1;
            for (var i = 0; i < particles.length; i++) {
                var p = particles[i];
                var a = field(p.x, p.y);
                var nx = p.x + Math.cos(a) * 1.2;
                var ny = p.y + Math.sin(a) * 1.2;
                var fade = Math.sin(Math.PI * p.age / p.life);
                var hue = 200 + 50 * Math.sin(p.x / w * 3 + t * 0.3);
                ctx.strokeStyle = "hsla(" + hue + ", 80%, " + (dark ? 62 : 42) + "%, " + (0.35 * fade) + ")";
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(nx, ny);
                ctx.stroke();
                p.x = nx;
                p.y = ny;
                if (++p.age > p.life || nx < 0 || ny < 0 || nx > w || ny > h) spawn(p);
            }
        }

        function loop() {
            step();
            requestAnimationFrame(loop);
        }

        function settle() {
            for (var i = 0; i < 240; i++) step();
        }

        resize();
        if (still) {
            settle();
            window.addEventListener("resize", function () { resize(); settle(); });
        } else {
            window.addEventListener("resize", resize);
            loop();
        }
    })();
</script>
</body>
</html>
